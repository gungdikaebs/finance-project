<div id="target-preview" aria-label="Rancangan Target dan Simulasi">
<style>
#target-preview{--t-bg:light-dark(#f3f5ef,#17221a);--t-panel:light-dark(#fff,#222c26);--t-text:light-dark(#202820,#edf4ee);--t-muted:light-dark(#667062,#b9c5b4);--t-line:light-dark(#e4e9df,#3c4a40);--t-soft:light-dark(#eaf0e4,#354530);--t-lime:#b8df38;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--t-text);margin:auto;width:100%;container-type:inline-size}
#target-preview *{box-sizing:border-box}#target-preview button,#target-preview input,#target-preview select{font:inherit}#target-preview button{cursor:pointer;min-height:44px}#target-preview svg{width:20px;height:20px;flex-shrink:0}#target-preview .t-shell{background:var(--t-bg);border:1px solid var(--t-line);border-radius:24px;overflow:hidden;display:grid;grid-template-columns:170px minmax(0,1fr)}#target-preview .t-side{background:var(--t-panel);padding:25px 16px;border-right:1px solid var(--t-line)}#target-preview .t-brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:500;letter-spacing:-.4px}#target-preview .t-brand svg{color:light-dark(#183d2b,#c6ddba)}#target-preview .t-sidenav{margin-top:32px;display:grid;gap:8px}#target-preview .t-sidenav span{display:flex;gap:9px;align-items:center;padding:12px 9px;color:var(--t-muted);font-size:12px}#target-preview .t-sidenav .t-active{background:var(--t-soft);color:var(--t-text);border-radius:12px}#target-preview .t-main{min-width:0;padding:25px}#target-preview .t-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}#target-preview h2{font-size:25px;font-weight:500;letter-spacing:-.8px;line-height:1.2;margin:4px 0}#target-preview h3{font-size:15px;font-weight:500;margin:0}#target-preview p{margin:0}#target-preview .t-muted{font-size:12px;color:var(--t-muted)}#target-preview .t-badge{font-size:11px;color:var(--t-muted);border:1px solid var(--t-line);padding:5px 9px;border-radius:20px;white-space:nowrap}#target-preview .t-targets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}#target-preview .t-target{display:flex;gap:12px;text-align:left;align-items:center;background:var(--t-panel);color:var(--t-text);border:1px solid var(--t-line);border-radius:16px;padding:14px}#target-preview .t-target[aria-pressed=true]{border-color:light-dark(#52733a,#b8df38);background:var(--t-soft)}#target-preview .t-target span{display:block}#target-preview .t-target svg{width:28px;height:28px}#target-preview .t-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}#target-preview .t-panel{background:var(--t-panel);border-radius:18px;padding:20px;min-width:0}#target-preview .t-title{display:flex;gap:8px;align-items:center;margin-bottom:17px}#target-preview .t-fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}#target-preview label{display:block;min-width:0;font-size:12px;color:var(--t-muted)}#target-preview input,#target-preview select{width:100%;min-width:0;background:var(--t-bg);color:var(--t-text);border:1px solid var(--t-line);border-radius:10px;font-size:16px;padding:10px;margin-top:6px;height:44px}#target-preview .t-full{grid-column:1/-1}#target-preview .t-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;background:var(--t-lime);color:#26390f;border-radius:12px;padding:12px;margin-top:20px;font-weight:500}#target-preview details{margin-top:17px;border-top:1px solid var(--t-line);padding-top:15px}#target-preview summary{cursor:pointer;min-height:44px;font-size:13px}#target-preview .t-hero{background:#183d2b;color:#fff;border-radius:17px;padding:21px;margin-bottom:15px}#target-preview .t-hero .t-muted{color:#d4e0cc}#target-preview .t-big{font-size:29px;letter-spacing:-.8px;font-weight:500;margin:7px 0;font-variant-numeric:tabular-nums}#target-preview .t-resultrow{display:flex;justify-content:space-between;gap:13px;padding:12px 0;border-bottom:1px solid var(--t-line);font-size:12px}#target-preview .t-resultrow strong{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}#target-preview .t-resultrow span{color:var(--t-muted)}#target-preview .t-phase{display:flex;gap:10px;align-items:center;padding:14px 0}#target-preview .t-phase+.t-phase{border-top:1px solid var(--t-line)}#target-preview .t-dot{width:30px;height:30px;border-radius:10px;background:var(--t-soft);display:grid;place-items:center;flex-shrink:0}#target-preview .t-phase strong{font-weight:500;display:block}#target-preview .t-note{font-size:11px;color:var(--t-muted);margin-top:14px}#target-preview .t-error{color:light-dark(#993521,#ffb49e);font-size:12px;margin-top:12px}#target-preview .t-bottom{display:none;background:var(--t-panel);border-top:1px solid var(--t-line);padding:12px 8px;grid-template-columns:repeat(4,1fr)}#target-preview .t-bottom span{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--t-muted);font-size:11px}#target-preview .t-bottom .t-active{color:var(--t-text)}#target-preview .t-bottom .t-active svg{background:var(--t-lime);color:#26390f;border-radius:6px}#target-preview .t-empty{text-align:center;padding:45px 15px}#target-preview .t-empty svg{width:35px;height:35px;margin-bottom:15px}#target-preview .t-mobileheader{display:none}#target-preview [hidden]{display:none!important}
@container(max-width:760px){#target-preview .t-shell{grid-template-columns:1fr}#target-preview .t-side{display:none}#target-preview .t-main{padding:20px 16px}#target-preview .t-grid{grid-template-columns:1fr}#target-preview .t-bottom{display:grid}#target-preview .t-mobileheader{display:block}#target-preview .t-panel{padding:18px}#target-preview .t-target{padding:12px;gap:8px}#target-preview .t-target svg{width:22px;height:22px}}
#target-preview.t-mobile{max-width:410px}#target-preview.t-mobile .t-shell{grid-template-columns:1fr}#target-preview.t-mobile .t-side{display:none}#target-preview.t-mobile .t-main{padding:20px 16px}#target-preview.t-mobile .t-grid{grid-template-columns:1fr}#target-preview.t-mobile .t-bottom{display:grid}#target-preview.t-mobile .t-mobileheader{display:block}
</style>
<div class="t-shell">
<aside class="t-side"><div class="t-brand"><i data-lucide="wallet" aria-hidden="true"></i>Ruang Uang</div><div class="t-sidenav" aria-label="Posisi halaman"><span><i data-lucide="house" aria-hidden="true"></i>Ringkasan</span><span><i data-lucide="arrow-left-right" aria-hidden="true"></i>Transaksi</span><span><i data-lucide="chart-pie" aria-hidden="true"></i>Anggaran</span><span class="t-active"><i data-lucide="piggy-bank" aria-hidden="true"></i>Tabungan</span></div></aside>
<main class="t-main">
<div class="t-header"><div><div class="t-muted t-mobileheader">Ruang Uang</div><p class="t-muted">Tabungan / Target</p><h2>Rencanakan impianmu</h2></div><span class="t-badge">Data contoh</span></div>
<div class="t-targets" aria-label="Pilih target contoh"><button class="t-target" type="button" data-target="vehicle" aria-pressed="false"><i data-lucide="bike" aria-hidden="true"></i><span>Kendaraan<span class="t-muted">Harga penuh</span></span></button><button class="t-target" type="button" data-target="house" aria-pressed="true"><i data-lucide="house" aria-hidden="true"></i><span>Rumah pertama<span class="t-muted">DP + cicilan</span></span></button></div>
<div class="t-grid">
<form id="target-form" class="t-panel"><div class="t-title"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><h3>Rencana target</h3></div>
<div class="t-fields">
<label class="t-full">Nama target<input id="t-name" value="Rumah pertama" maxlength="60" required></label>
<label class="t-full">Harga saat ini (Rp)<input id="t-price" type="number" min="1" max="1000000000000" step="1" value="600000000" required></label>
<label>Sudah terkumpul (Rp)<input id="t-saved" type="number" min="0" max="1000000000000" step="1" value="30000000" required></label>
<label>Kenaikan harga (%/tahun)<input id="t-growth" type="number" min="0" max="100" step="0.1" value="3" required></label>
<label class="t-full">Hitung berdasarkan<select id="t-mode"><option value="deposit">Setoran per bulan → waktu tercapai</option><option value="deadline">Tenggat → setoran yang diperlukan</option></select></label>
<label id="t-deposit-label" class="t-full">Setoran rencana (Rp/bulan)<input id="t-deposit" type="number" min="0" max="1000000000000" step="1" value="3000000" required></label>
<label id="t-deadline-label" class="t-full" hidden>Tenggat (bulan dari sekarang)<input id="t-deadline" type="number" min="1" max="600" step="1" value="36"></label>
</div>
<details id="t-loan-settings" open><summary>DP dan simulasi KPR</summary><div class="t-fields">
<label>DP (% harga rumah)<input id="t-dp" type="number" min="1" max="99" step="1" value="20" required></label>
<label>Biaya awal (Rp)<input id="t-fees" type="number" min="0" max="1000000000000" step="1" value="20000000" required></label>
<label>Tenor (tahun)<input id="t-tenor" type="number" min="1" max="30" step="1" value="15" required></label>
<label>Fixed selama (tahun)<input id="t-fixed-years" type="number" min="0" max="30" step="1" value="3" required></label>
<label>Bunga fixed (%/tahun)<input id="t-fixed-rate" type="number" min="0" max="100" step="0.1" value="5" required></label>
<label>Asumsi floating (%/tahun)<input id="t-float-rate" type="number" min="0" max="100" step="0.1" value="10" required></label>
</div></details>
<p class="t-note">Harga acuan & awal simulasi: 16 Sep 2026. Semua angka merupakan contoh yang bisa diubah.</p>
<button class="t-primary" type="submit"><i data-lucide="calculator" aria-hidden="true"></i>Hitung simulasi</button><p id="t-error" class="t-error" role="alert"></p>
</form>
<section class="t-panel" aria-label="Hasil simulasi"><div class="t-title"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i><h3>Perkiraan hasil</h3></div><div id="t-result" aria-live="polite"></div></section>
</div>
</main>
<div class="t-bottom" aria-label="Posisi navigasi mobile"><span><i data-lucide="house" aria-hidden="true"></i>Ringkasan</span><span><i data-lucide="arrow-left-right" aria-hidden="true"></i>Transaksi</span><span><i data-lucide="chart-pie" aria-hidden="true"></i>Anggaran</span><span class="t-active"><i data-lucide="piggy-bank" aria-hidden="true"></i>Tabungan</span></div>
</div>
<script>
(()=>{
const root=document.getElementById('target-preview'),get=id=>root.querySelector('#'+id),money=n=>'Rp'+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(n);
const state={target:'house',mobile:false,preview:'ready'};
// Calculation helpers are scoped to this planning preview, not production code.
function payment(p,r,n){return r===0?p/n:p*r/(-Math.expm1(-n*Math.log1p(r)))}
function mortgage(p,months,fixedMonths,fixedRate,floatRate){let balance=p,total=0,first=0,next=0,amount=0,peak=0;for(let i=0;i<months;i++){const rate=(i<fixedMonths?fixedRate:floatRate)/1200;if(i===0||i===fixedMonths){amount=payment(balance,rate,months-i);if(i===0)first=amount;if(i===fixedMonths)next=amount}const interest=balance*rate,paid=Math.min(amount,balance+interest);balance=Math.max(0,balance+interest-paid);total+=paid;peak=Math.max(peak,paid)}return{first,next:fixedMonths===0?first:fixedMonths>=months?null:next,total,interest:total-p,peak,balance}}
function project(v){const cost=m=>v.price*Math.pow(1+v.growth/100,m/12),need=m=>(v.house?cost(m)*v.dp/100:cost(m))+v.fees;let m=0,deposit=v.deposit;if(v.mode==='deadline'){m=v.deadline;deposit=Math.ceil(Math.max(0,need(m)-v.saved)/m)}else{while(m<=600&&v.saved+deposit*m<need(m))m++;if(m>600)return{reached:false}}const price=cost(m),required=need(m),loan=v.house?price*(1-v.dp/100):0;return{reached:true,m,deposit,price,required,loan}}
function value(id){return Number(get(id).value)}
function row(label,n){return '<div class="t-resultrow"><span>'+label+'</span><strong>'+money(n)+'</strong></div>'}
function date(m){return new Intl.DateTimeFormat('id-ID',{month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(2026,8+m,16)))}
function duration(m){return m===0?'Dana sudah cukup':(Math.floor(m/12)?Math.floor(m/12)+' tahun ':'')+(m%12?m%12+' bulan':'')}
function calculate(){
const out=get('t-result'),error=get('t-error');error.textContent='';
if(state.preview==='empty'){out.innerHTML='<div class="t-empty"><i data-lucide="flag" aria-hidden="true"></i><h3>Belum ada simulasi</h3><p class="t-muted">Lengkapi rencana, lalu hitung perkiraannya.</p></div>';icons();return}
if(state.preview==='error'){out.innerHTML='<div class="t-empty"><h3>Hasil belum tersedia</h3><p class="t-muted">Periksa isian lalu coba hitung kembali.</p></div>';return}
const v={house:state.target==='house',price:value('t-price'),saved:value('t-saved'),growth:value('t-growth'),mode:get('t-mode').value,deposit:value('t-deposit'),deadline:value('t-deadline'),dp:value('t-dp'),fees:state.target==='house'?value('t-fees'):0};
if(!get('target-form').checkValidity()){get('target-form').reportValidity();return}
const tenor=value('t-tenor')*12,fixed=value('t-fixed-years')*12;
if(v.house&&fixed>tenor){error.textContent='Periode fixed tidak boleh melebihi tenor.';out.innerHTML='<p class="t-muted">Perbaiki isian untuk melihat hasil terbaru.</p>';return}
const r=project(v);if(!r.reached){out.innerHTML='<div class="t-hero"><p class="t-muted">Dengan rencana saat ini</p><p class="t-big">Belum tercapai</p><p>Dalam simulasi 50 tahun</p></div><p class="t-muted">Coba setoran lebih besar atau gunakan mode tenggat.</p>';return}
const title=v.mode==='deadline'?money(r.deposit)+'/bulan':duration(r.m),sub=v.mode==='deadline'?'Setoran minimum untuk tenggat':'Perkiraan '+(v.house?'dana awal terkumpul':'dana pembelian terkumpul');
out.innerHTML='<div class="t-hero"><p class="t-muted">'+sub+'</p><p class="t-big">'+title+'</p><p>'+date(r.m)+'</p></div>'+row('Dana target saat ini',v.saved)+row('Harga perkiraan saat pembelian',r.price)+(v.house?row('DP '+v.dp+'%',r.price*v.dp/100)+row('Biaya awal asumsi saat pembelian',v.fees):'')+row(v.house?'Total kebutuhan dana awal':'Dana pembelian dibutuhkan',r.required);
if(v.house){const k=mortgage(r.loan,tenor,fixed,value('t-fixed-rate'),value('t-float-rate'));out.innerHTML+=row('Perkiraan pokok pinjaman',r.loan)+'<div class="t-phase"><span class="t-dot">1</span><div><p class="t-muted">'+(fixed?'Fixed · '+value('t-fixed-rate')+'% per tahun':'Floating sejak awal · '+value('t-float-rate')+'% per tahun')+'</p><strong>'+money(k.first)+'/bulan</strong></div></div>'+(fixed>0&&fixed<tenor?'<div class="t-phase"><span class="t-dot">2</span><div><p class="t-muted">Mulai cicilan ke-'+(fixed+1)+' · Asumsi '+value('t-float-rate')+'%</p><strong>'+money(k.next)+'/bulan</strong></div></div>':'')+row('Total bunga simulasi',k.interest)+row('Total pembayaran pinjaman',k.total)+row('Total pembelian, DP & biaya awal',k.total+r.price*v.dp/100+v.fees)+'<p class="t-note">Perkiraan lunas '+date(r.m+tenor)+'. Angsuran pokok + bunga; biaya berkala belum termasuk. Bunga floating adalah asumsi, bukan penawaran bank.</p>'}
out.innerHTML+='<p class="t-note">Setoran akhir bulan, tanpa hasil investasi. Mengubah simulasi tidak mengubah saldo atau tabungan aktual.</p>';
}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:20,height:20}})}
function setTarget(target){state.target=target;root.querySelectorAll('[data-target]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.target===target)));const house=target==='house';get('t-name').value=house?'Rumah pertama':'Kendaraan pertama';get('t-price').value=house?600000000:25000000;get('t-saved').value=house?30000000:1000000;get('t-deposit').value=house?3000000:500000;get('t-loan-settings').hidden=!house;get('t-loan-settings').querySelectorAll('input').forEach(i=>i.disabled=!house);calculate()}
function mode(){const deadline=get('t-mode').value==='deadline';get('t-deposit-label').hidden=deadline;get('t-deposit').disabled=deadline;get('t-deadline-label').hidden=!deadline;get('t-deadline').disabled=!deadline}
get('target-form').addEventListener('submit',e=>{e.preventDefault();state.preview='ready';calculate()});get('t-mode').addEventListener('change',mode);
root.querySelectorAll('[data-target]').forEach(b=>b.addEventListener('click',()=>setTarget(b.dataset.target)));
get('target-form').addEventListener('input',()=>{get('t-result').innerHTML='<p class="t-muted">Rencana berubah. Tekan Hitung simulasi untuk memperbarui hasil.</p>'});
get('t-mode').addEventListener('change',()=>{get('t-result').innerHTML='<p class="t-muted">Mode berubah. Tekan Hitung simulasi untuk melihat hasil.</p>'});
function appearance(){root.classList.toggle('t-mobile',state.mobile);calculate();icons()}
mode();calculate();icons();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:appearance});t.addToggle(state,'mobile',{label:'Pratinjau lebar HP'});t.addSelect(state,'preview',{label:'Keadaan hasil',options:[{label:'Terisi',value:'ready'},{label:'Kosong',value:'empty'},{label:'Gagal',value:'error'}]})}
})();
</script>
</div>
