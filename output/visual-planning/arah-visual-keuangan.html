:flex;justify-content:space-between;align-items:center;gap:8px;margin:23px 0 10px}#rencana-uang .u-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0}#rencana-uang .u-row strong{font-weight:500;font-variant-numeric:tabular-nums}#rencana-uang .u-track{height:6px;background:var(--uang-line);border-radius:10px;overflow:hidden;margin:7px 0 4px}#rencana-uang .u-fill{height:100%;background:var(--uang-accent);border-radius:10px}#rencana-uang .u-icon{width:38px;height:38px;background:var(--uang-soft);color:var(--uang-accent);display:grid;place-items:center;border-radius:12px;flex-shrink:0}#rencana-uang .u-item{display:flex;align-items:center;gap:10px}#rencana-uang .u-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--uang-panel);border-top:1px solid var(--uang-line);padding:10px 8px 12px}#rencana-uang .u-nav button{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;border-radius:12px;background:transparent;color:var(--uang-muted);font-size:11px;padding:9px 2px}#rencana-uang .u-nav button[aria-current=page]{background:var(--uang-soft);color:var(--uang-accent)}#rencana-uang .u-nav svg{width:19px;height:19px}#rencana-uang .u-label{display:block;margin:16px 0 6px}#rencana-uang input,#rencana-uang select{width:100%;padding:12px;border:1px solid var(--uang-line);border-radius:12px;background:var(--uang-panel);color:var(--uang-ink);font-size:16px;min-width:0}#rencana-uang .u-formactions{display:flex;gap:8px;margin-top:24px}#rencana-uang .u-status{color:var(--uang-accent);margin-top:10px;font-size:12px}#rencana-uang .u-error{color:light-dark(#ad352a,#ffb4a8);margin-top:10px}#rencana-uang .u-tag{display:inline-block;font-size:11px;border-radius:6px;background:var(--uang-soft);color:var(--uang-accent);padding:3px 7px;margin-bottom:8px}#rencana-uang .u-goalamount{font-size:22px;font-weight:500;margin:10px 0 0;letter-spacing:-.5px}@media(max-width:360px){#rencana-uang .u-content{padding:12px 15px 18px}#rencana-uang .u-top{padding:18px 15px 10px}#rencana-uang .u-panel{padding:15px}#rencana-uang .u-value{font-size:28px}}
/* Visual revision: reference image, icon + label, dark olive and lime. */
#rencana-uang{--uang-bg:light-dark(#eeefe9,#1e241a);--uang-ink:light-dark(#242b1c,#edf3e6);--uang-muted:light-dark(#666e5d,#b5bfaa);--uang-panel:light-dark(#fff,#2a3224);--uang-line:light-dark(#e3e6dc,#434d38);--uang-cyan:light-dark(#d8ebed,#314d50);--uang-lime:#b8df38}
#rencana-uang .u-shell{position:relative;border-radius:32px}#rencana-uang .u-brand{letter-spacing:-.4px}#rencana-uang .u-brand svg{background:var(--uang-lime);color:#22320b;width:34px;height:34px;padding:7px;border-radius:12px}#rencana-uang .u-panel{border:0;border-radius:23px}#rencana-uang .u-hero{background:light-dark(#e1eabf,#3e4c2b)}#rencana-uang .u-balance-card{position:relative;isolation:isolate;overflow:hidden;background:#1b280f;color:#fff;min-height:208px;padding:22px;border-radius:23px;margin-bottom:9px}#rencana-uang .u-balance-card:before{content:"";position:absolute;z-index:-1;width:240px;height:360px;border-radius:48%;background:#344916;transform:rotate(-36deg);right:-110px;top:-110px}#rencana-uang .u-balance-card:after{content:"";position:absolute;z-index:-1;width:170px;height:260px;border-radius:48%;background:#263c12;transform:rotate(-36deg);right:10px;top:-130px}#rencana-uang .u-balance-card .u-muted{color:#d4dec4}#rencana-uang .u-balance-card .u-value{font-size:34px;margin:22px 0 17px}#rencana-uang .u-balance-card .u-split{border-top:1px solid #53603f;padding-top:13px}#rencana-uang .u-balance-card strong{font-size:13px}#rencana-uang .u-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#rencana-uang .u-action{border:0;background:var(--uang-cyan);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--uang-ink);padding:12px 3px;font-size:11px;font-weight:500}#rencana-uang .u-action:last-child{background:light-dark(#e1eabf,#3e4c2b)}#rencana-uang .u-action svg{width:22px;height:22px}#rencana-uang .u-stat{padding:15px;background:var(--uang-panel);border-radius:21px}#rencana-uang .u-stat:last-child{background:light-dark(#e1eabf,#3e4c2b)}#rencana-uang .u-stat .u-icon{width:30px;height:30px;margin-bottom:12px;background:var(--uang-lime);color:#25350d}#rencana-uang .u-stat strong{font-size:18px;letter-spacing:-.5px;overflow-wrap:anywhere}#rencana-uang .u-icon svg{width:20px;height:20px}#rencana-uang .u-nav button[aria-current=page]{background:transparent;color:var(--uang-ink)}#rencana-uang .u-nav button[aria-current=page] svg{background:var(--uang-lime);color:#25350d;border-radius:9px}#rencana-uang .u-nav svg{width:33px;height:30px;padding:5px}#rencana-uang .u-fill{background:var(--uang-lime)}#rencana-uang .u-primary{background:var(--uang-cyan);color:var(--uang-ink);border-radius:15px}#rencana-uang .u-overlay[hidden]{display:none}#rencana-uang .u-overlay{position:absolute;inset:0;z-index:10;background:#152009a8;display:flex;align-items:flex-end}#rencana-uang .u-sheet{background:var(--uang-panel);width:100%;padding:10px 23px 25px;border-radius:30px 30px 0 0}#rencana-uang .u-handle{width:43px;height:5px;background:var(--uang-muted);border-radius:5px;margin:0 auto 22px}#rencana-uang .u-sheettop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}#rencana-uang .u-close{border:0;border-radius:50%;background:var(--uang-bg);color:var(--uang-ink);width:44px;display:grid;place-items:center}#rencana-uang .u-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}#rencana-uang .u-presets button{background:var(--uang-bg);border:0;border-radius:13px;color:var(--uang-ink);font-size:12px}#rencana-uang .u-presets button[aria-pressed=true]{background:#1b280f;color:#fff}#rencana-uang .u-sheet input,#rencana-uang .u-sheet select{background:var(--uang-bg);border:0}#rencana-uang .u-sheet .u-head{display:none}#rencana-uang .u-status-global{padding:0 22px 10px;font-size:12px;color:var(--uang-muted)}
/* Approved palette: dark green identity, restrained lime, neutral surfaces. */
#rencana-uang{--uang-bg:light-dark(#f3f5ef,#17221a);--uang-ink:light-dark(#202820,#edf4ee);--uang-panel:light-dark(#ffffff,#222b26);--uang-cyan:light-dark(#edf2ea,#303e33)}
#rencana-uang .u-balance-card{background:linear-gradient(125deg,#183d2b 0%,#214630 65%,#365228 100%);box-shadow:0 9px 22px #16362218}
#rencana-uang .u-balance-card:before{background:#698638;right:-120px;opacity:.4}
#rencana-uang .u-balance-card:after{background:#3e642d;opacity:.6}
#rencana-uang .u-action:first-child,#rencana-uang .u-action:nth-child(2){background:var(--uang-panel)}
#rencana-uang .u-action:last-child{background:var(--uang-lime);color:#26390f}
#rencana-uang .u-action:first-child svg{color:light-dark(#286186,#95cce9)}
#rencana-uang .u-action:nth-child(2) svg{color:light-dark(#99502c,#f5b791)}
#rencana-uang .u-stat:first-child,#rencana-uang .u-stat:last-child,#rencana-uang .u-hero{background:var(--uang-panel)}
#rencana-uang .u-stat:first-child .u-icon{background:light-dark(#e2f0fa,#294657);color:light-dark(#286186,#bae4ff)}
#rencana-uang .u-stat:last-child .u-icon{background:light-dark(#ffeadc,#573e30);color:light-dark(#99502c,#ffd7bd)}
#rencana-uang .u-icon,#rencana-uang .u-row:nth-child(2) .u-icon{background:light-dark(#edf2e7,#34452e);color:light-dark(#34583d,#c1d8b4)}
#rencana-uang .u-primary{background:var(--uang-lime);color:#26390f}
#rencana-uang .u-tag{background:var(--uang-bg);color:var(--uang-muted)}
#rencana-uang .u-brand svg{background:light-dark(#183d2b,#c1d8b4);color:light-dark(#ffffff,#183d2b)}
#rencana-uang .u-fill{background:light-dark(#456b47,#a0be8d)}
#rencana-uang .u-nav{box-shadow:0 -4px 18px #142d1308}
</style>
<div class="u-shell">
 <div id="uang-base">
 <header class="u-top"><div class="u-brand"><i data-lucide="wallet" aria-hidden="true"></i>Ruang Uang</div><span class="u-sample">Data contoh</span></header>
 <main class="u-content" id="uang-view"></main>
 <nav class="u-nav" aria-label="Navigasi utama">
  <button type="button" data-page="Ringkasan" aria-current="page"><i data-lucide="layout-dashboard" aria-hidden="true"></i>Ringkasan</button>
  <button type="button" data-page="Transaksi"><i data-lucide="arrow-left-right" aria-hidden="true"></i>Transaksi</button>
  <button type="button" data-page="Anggaran"><i data-lucide="chart-pie" aria-hidden="true"></i>Anggaran</button>
  <button type="button" data-page="Tabungan"><i data-lucide="landmark" aria-hidden="true"></i>Tabungan</button>
 </nav>
 <p id="uang-global-status" class="u-status-global" role="status"></p>
 </div>
 <div id="uang-overlay" class="u-overlay" hidden><section class="u-sheet" role="dialog" aria-modal="true" aria-labelledby="uang-sheet-title"><div class="u-handle" aria-hidden="true"></div><div class="u-sheettop"><h2 id="uang-sheet-title">Catat transaksi</h2><button class="u-close" type="button" data-action="back" aria-label="Tutup"><i data-lucide="x" aria-hidden="true"></i></button></div><div id="uang-sheetbody"></div></section></div>
</div>
<script>
(()=>{
 const root=document.getElementById('rencana-uang'),view=root.querySelector('#uang-view'),overlay=root.querySelector('#uang-overlay'),sheet=root.querySelector('#uang-sheetbody'),base=root.querySelector('#uang-base');
 const state={page:'Ringkasan',expense:900000,income:3000000,saved:0,guard:6000000,dream:1000000,theme:'hijau',radius:23,modal:null};
 let previousFocus=null;
 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const actions=()=>`<div class="u-actions"><button class="u-action" data-action="income">${icon('circle-plus')}Pemasukan</button><button class="u-action" data-action="entry">${icon('arrow-up-right')}Pengeluaran</button><button class="u-action" data-action="save">${icon('piggy-bank')}Sisihkan</button></div>`;
 const money=n=>'Rp'+new Intl.NumberFormat('id-ID').format(n);
 const head=(title,sub)=>`<div class="u-head"><h2>${title}</h2><p class="u-muted">${sub}</p></div>`;
 const bar=(label,value,total,detail)=>`<div class="u-row"><span>${label}</span><strong>${money(value)}</strong></div><div class="u-track" role="meter" aria-label="${label}" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="${total}"><div class="u-fill" style="width:${Math.min(100,value/total*100)}%"></div></div><p class="u-muted">${detail}</p>`;
 function render(){
 root.style.setProperty('--uang-radius',state.radius+'px');
 root.style.setProperty('--uang-accent','light-dark(#465c1d,#c6e392)');
 root.style.setProperty('--uang-soft','light-dark(#e1eabf,#3e4c2b)');
 root.style.setProperty('--uang-lime',state.theme==='hijau'?'#b8df38':'#c6d69a');
 const total=9900000+state.income-state.expense,free=total-7000000-state.saved;
 root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});

 if(state.page==='Ringkasan')view.innerHTML=head('Ringkasan','September 2026')+`<section class="u-panel u-balance-card"><p>Saldo utama</p><div class="u-value">${money(total)}</div><div class="u-split"><div><span class="u-muted">Belum disisihkan</span><strong>${money(free)}</strong></div><div><span class="u-muted">Dana tersisih</span><strong>${money(7000000+state.saved)}</strong></div></div></section>${actions()}<div class="u-section"><h3>Bulan ini</h3></div><div class="u-split"><div class="u-stat"><span class="u-icon">${icon('arrow-down-left')}</span><span class="u-muted">Pemasukan</span><strong>${money(state.income)}</strong></div><div class="u-stat"><span class="u-icon">${icon('arrow-up-right')}</span><span class="u-muted">Pengeluaran</span><strong>${money(state.expense)}</strong></div></div><div class="u-section"><h3>Tabungan & tujuan</h3><span class="u-muted">2 tujuan</span></div><section class="u-panel"><div class="u-row"><div class="u-item"><span class="u-icon">${icon('shield-check')}</span><div>Dana pengaman<p class="u-muted">${(state.guard/2000000).toFixed(1).replace('.',',')} bulan kebutuhan</p></div></div><strong>${money(state.guard)}</strong></div><div class="u-row"><div class="u-item"><span class="u-icon">${icon('bike')}</span><div>Kendaraan<p class="u-muted">Target Rp25 juta</p></div></div><strong>${money(state.dream)}</strong></div></section>`;
 if(state.page==='Transaksi')view.innerHTML=head('Transaksi','September 2026')+actions()+`<div class="u-section"><h3>Aktivitas bulan ini</h3></div><section class="u-panel"><div class="u-row"><div class="u-item"><span class="u-icon">${icon('arrow-down-left')}</span><div>Pemasukan<p class="u-muted">Total contoh bulan ini</p></div></div><strong>+${money(state.income)}</strong></div><div class="u-divider u-row"><div class="u-item"><span class="u-icon">${icon('shopping-bag')}</span><div>Kebutuhan<p class="u-muted">Total contoh bulan ini</p></div></div><strong>−${money(state.expense)}</strong></div></section>`;
 if(state.page==='Anggaran')view.innerHTML=head('Anggaran','September 2026')+`<section class="u-panel"><span class="u-tag">Pembagian 50 / 30 / 20</span>${bar('Kebutuhan · 50%',state.expense,state.income*.5,'Batas '+money(state.income*.5))}${bar('Tabungan · 30%',state.saved,state.income*.3,'Target penyisihan '+money(state.income*.3))}${bar('Keinginan · 20%',0,state.income*.2,'Batas '+money(state.income*.2))}</section><section class="u-panel u-hero"><h3>Alokasi tabungan</h3><p class="u-muted" style="margin:8px 0 16px">Dana pengaman 60% · Impian 40%</p><button class="u-primary" data-action="save">${icon('piggy-bank')}Sisihkan</button></section>`;
 if(state.page==='Tabungan')view.innerHTML=head('Tabungan','Dana pengaman & impian')+`<section class="u-panel u-hero"><span class="u-icon">${icon('shield-check')}</span><h3>Dana pengaman</h3><p class="u-goalamount">${money(state.guard)}</p>${bar('Target Rp12 juta',state.guard,12000000,'Kebutuhan pokok contoh Rp2 juta / bulan')}</section><section class="u-panel"><span class="u-icon">${icon('bike')}</span><h3>Kendaraan pertama</h3><p class="u-goalamount">${money(state.dream)}</p>${bar('Target Rp25 juta',state.dream,25000000,'Harga penuh')}</section><button class="u-primary" data-action="save">${icon('piggy-bank')}Sisihkan</button>`;
 if(globalThis.lucide)lucide.createIcons();

 }
 function split(){const input=sheet.querySelector('#uang-amount'),n=Math.max(0,Number(input.value)||0),g=Math.round(n*.6);if(state.modal==='save'){sheet.querySelector('#uang-part1').textContent=money(g);sheet.querySelector('#uang-part2').textContent=money(n-g)}sheet.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.preset)===n)))}
 function open(type,trigger){
 state.modal=type;previousFocus=trigger;const saving=type==='save',income=type==='income';
 root.querySelector('#uang-sheet-title').textContent=saving?'Sisihkan tabungan':income?'Catat pemasukan':'Catat pengeluaran';
 sheet.innerHTML=`<p class="u-muted">${saving?'Dana pengaman dan impian berjalan bersama.':'Catat uang '+(income?'masuk':'keluar')+' ke Saldo utama.'}</p><form id="uang-form"><label class="u-label" for="uang-amount">Nominal (Rp)</label><input id="uang-amount" type="number" inputmode="numeric" min="1" step="1" value="${saving?Math.max(1,Math.round(state.income*.3-state.saved)):income?500000:25000}" required><div class="u-presets">${[25000,100000,500000].map(n=>'<button type="button" data-preset="'+n+'">'+money(n)+'</button>').join('')}</div>${saving?'<div aria-live="polite"><div class="u-row"><span>Dana pengaman · 60%</span><strong id="uang-part1"></strong></div><div class="u-row"><span>Kendaraan · 40%</span><strong id="uang-part2"></strong></div></div><p class="u-muted">Total Saldo utama tetap sama.</p>':'<label class="u-label" for="uang-category">'+(income?'Sumber':'Kategori')+'</label><select id="uang-category">'+(income?['Freelance','Gaji','Lainnya']:['Makan & minum','Transportasi','Tagihan']).map(x=>'<option>'+x+'</option>').join('')+'</select><label class="u-label" for="uang-date">Tanggal</label><input id="uang-date" type="date" value="2026-09-16" required>'}<div class="u-formactions"><button type="submit" class="u-primary">${icon(saving?'check':'plus')}${saving?'Konfirmasi':'Simpan'}</button></div><p id="uang-error" class="u-error" role="alert"></p></form>`;
 base.inert=true;overlay.hidden=false;split();if(globalThis.lucide)lucide.createIcons();overlay.querySelector('.u-close').focus();
 }
 function close(){overlay.hidden=true;base.inert=false;state.modal=null;if(previousFocus?.isConnected)previousFocus.focus()}
 root.addEventListener('click',e=>{if(e.target===overlay){close();return}const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.action){if(b.dataset.action==='back')close();else open(b.dataset.action,b);return}if(b.dataset.preset){sheet.querySelector('#uang-amount').value=b.dataset.preset;split()}});
 root.addEventListener('input',e=>{if(e.target.id==='uang-amount')split()});
 root.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const items=[...overlay.querySelectorAll('button,input,select')],first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
 root.addEventListener('submit',e=>{e.preventDefault();const n=Number(sheet.querySelector('#uang-amount').value),kind=state.modal,free=9900000+state.income-state.expense-7000000-state.saved;if(!Number.isSafeInteger(n)||n<=0||(kind!=='income'&&n>free)){sheet.querySelector('#uang-error').textContent='Masukkan nominal bulat yang valid'+(kind==='income'?'.':' dan tidak melebihi uang belum disisihkan.');return}if(kind==='save'){const g=Math.round(n*.6);state.saved+=n;state.guard+=g;state.dream+=n-g}else if(kind==='income')state.income+=n;else state.expense+=n;close();render();root.querySelector('#uang-global-status').textContent=(kind==='save'?'Penyisihan':'Transaksi')+' contoh berhasil dicatat.';root.querySelector('.u-nav [aria-current="page"]')?.focus()});

 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(state,'theme',{label:'Warna aksen',options:[{label:'Lime cerah',value:'hijau'},{label:'Sage lembut',value:'sage'}]});tweak.addSlider(state,'radius',{label:'Sudut panel',min:8,max:24,step:2,unit:'px'})}
