<!doctype html>
<html lang="id" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nalara | Kelola uang tanpa menebak-nebak</title>
    <meta name="description" content="Catat pemasukan dan pengeluaran, lihat pembagian anggaran, lalu pantau tabungan dan targetmu di Nalara." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nalara" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#183D2B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1410" media="(prefers-color-scheme: dark)" />
    <!-- Anti-FOUC Theme Detection Script -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-[100dvh] bg-[#F3F5EF] text-[#18221B] dark:bg-[#0E1410] dark:text-[#F0F4F1] transition-colors duration-200 antialiased selection:bg-[#B8DF38]/30 selection:text-[#183D2B]">
    <div id="app" class="min-h-[100dvh]"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
