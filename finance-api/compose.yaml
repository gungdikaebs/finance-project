name: nalara-api

services:
  api:
    container_name: nalara-api
    build:
      context: .
      dockerfile: Dockerfile
    image: nalara-api:local
    env_file: ${API_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: file:/data/finance.db
      NODE_ENV: production
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - nalara_sqlite:/data
    networks:
      - default
      - proxy_network
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  nalara_sqlite:

networks:
  default:
  proxy_network:
    external: true
